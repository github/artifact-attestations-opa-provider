name: Publish v0.1.1 to ACR

on:
  push:
    branches:
      - publish-acr-2

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish v0.1.1 to ACR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout v0.1.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v0.1.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ secrets.ACR_MODA_REGISTRY }}
          username: ${{ secrets.ACR_MODA_USER }}
          password: ${{ secrets.ACR_MODA_TOKEN }}

      - name: Build and push Docker image to ACR
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.ACR_MODA_REGISTRY }}/artifact-attestations-opa-provider:v0.1.1
          platforms: linux/amd64,linux/arm64

      - name: Attest build provenance for ACR
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ secrets.ACR_MODA_REGISTRY }}/artifact-attestations-opa-provider
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true